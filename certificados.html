<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Certificado Premium - ANDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .cert-container { 
            width: 800px; height: 550px; background: #fff; padding: 40px; border: 15px double #d4af37; 
            text-align: center; position: relative; color: #1a1a1a; font-family: 'Cinzel', serif;
        }
        .cert-header { font-family: 'Orbitron'; font-size: 2.5rem; color: #d4af37; margin-bottom: 10px; }
        .cert-body { margin-top: 30px; font-size: 1.2rem; }
        .aluno-nome { font-size: 2rem; border-bottom: 2px solid #333; display: inline-block; margin: 20px 0; min-width: 400px; }
        .seal { 
            position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; 
            background: #d4af37; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; color: white; font-weight: bold; transform: rotate(-15deg);
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="cert-container">
        <div class="cert-header">CERTIFICADO</div>
        <div class="cert-body">
            Certificamos que o colaborador(a)
            <div class="aluno-nome" id="print_nome">CARREGANDO...</div><br>
            concluiu com aproveitamento o treinamento de
            <h2 id="print_nr">TREINAMENTO TÉCNICO</h2>
            realizado em <span id="print_data">--/--/----</span>.<br>
            Carga horária: 08 horas.
        </div>
        <div class="seal">ANDA<br>SST</div>
        <button class="no-print" onclick="window.print()" style="margin-top:50px; padding:10px 20px; cursor:pointer;">IMPRIMIR CERTIFICADO</button>
    </div>

    <script src="polimata-core.js"></script>
    <script>
        window.onload = () => {
            Polimata.load('treinamento_atual', (data) => {
                if(data) {
                    document.getElementById('print_nome').innerText = data.aluno;
                    document.getElementById('print_nr').innerText = data.nr.toUpperCase();
                    document.getElementById('print_data').innerText = data.data;
                }
            });
        };
    </script>
</body>
</html>
