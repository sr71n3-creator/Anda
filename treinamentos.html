<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDA - Gestão de Treinamentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0b10; --surf: #161b22; --border: #30363d; --gold: #d4af37; --text: #f0f6fc; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; padding: 20px; margin: 0; }
        .header { border-bottom: 2px solid var(--gold); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .title { font-family: 'Orbitron'; color: var(--gold); font-size: 1.3rem; }
        .card { background: var(--surf); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        label { font-size: 0.7rem; color: var(--gold); text-transform: uppercase; display: block; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .badge-status { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; float: right; }
        .valid { background: #238636; } .expired { background: #da3633; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 18px; width: 100%; border-radius: 10px; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <div><div class="title">TREINAMENTOS</div><small>Gestão de Capacitação NRs</small></div>
        <a href="index.html" style="color:#666; text-decoration:none; font-size:0.8rem;">↩ HUB</a>
    </div>

    <div class="card">
        <label>Colaborador</label>
        <input type="text" id="t_nome" placeholder="Nome do Aluno">
        <label>Norma Regulamentadora</label>
        <select id="t_nr">
            <option value="nr35">NR-35 - Trabalho em Altura</option>
            <option value="nr33">NR-33 - Espaço Confinado</option>
            <option value="nr10">NR-10 - Segurança em Eletricidade</option>
            <option value="nr12">NR-12 - Operação de Máquinas</option>
        </select>
    </div>

    <div class="card">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><label>Data Realização</label><input type="date" id="t_data"></div>
            <div><label>Validade (Meses)</label><input type="number" id="t_val" value="24"></div>
        </div>
        <label>Instrutor / Responsável</label>
        <input type="text" id="t_instrutor" placeholder="Nome do Profissional Habilitado">
    </div>

    <button class="btn-gold" onclick="salvarTreinamento()">REGISTRAR E GERAR CERTIFICADO</button>

    <script src="polimata-core.js"></script>
    <script>
        async function salvarTreinamento() {
            const data = {
                aluno: document.getElementById('t_nome').value,
                nr: document.getElementById('t_nr').value,
                data: document.getElementById('t_data').value,
                instrutor: document.getElementById('t_instrutor').value
            };
            await Polimata.save('treinamento_atual', data);
            window.location.href = 'certificados.html';
        }
    </script>
</body>
</html>
